@if (!productsList()) {
  <div class="loading-div">
    <p>იტვირთება!</p>
  </div>
} @else {
  <h1 class="title">ჩვენი პროდუქტები</h1>

  <div class="products">
    @if (productsList()) {
      @for (item of productsList().products; track item._id) {
        <app-product-card [product]="item"></app-product-card>
      }
    }
  </div>

  <div class="np-btn">
        <button type="button" (click)="prevPage()" [disabled]="pageIndex() === 1">Prev</button>

        <span> {{ pageIndex() }} გვერდი</span>

        <button
          type="button"
          (click)="nextPage()"
          [disabled]="pageIndex() * pageSize() >= productsList().total"
        >
          Next
        </button>
      </div>


  
}
