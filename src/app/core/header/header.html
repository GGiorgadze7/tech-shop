<header>
  <img class="logo-img" src="/svg/gemini-svg.svg" alt="logo" routerLink="/" />
  <div class="nav-div">
    <nav>
      <ul>
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            >მთავარი</a
          >
        </li>
        <li><a routerLink="/about" routerLinkActive="active">ჩვენს შესახებ</a></li>
        <li><a routerLink="/contact" routerLinkActive="active">კონტაქტი</a></li>
      </ul>
    </nav>
  </div>

  <div class="burger-menu" [class.appear-menu]="AppearMenu">
    <div class="burger-list">
      <ul>
        <li>
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="menuToggle()"
            >მთავარი</a
          >
        </li>
        <li>
          <a routerLink="/about" routerLinkActive="active" (click)="menuToggle()">ჩვენს შესახებ</a>
        </li>
        <li>
          <a routerLink="/contact" routerLinkActive="active" (click)="menuToggle()">კონტაქტი</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="btns">
    <button class="user-img" routerLink="/cart">
      🛒
    </button>

    <button routerLink="/signin" class="user-img">
      👤
    </button>

    <button class="theme-btn" (click)="theme.toggle()">
    {{ theme.isDark() ? '☀️' : '🌙' }}
  </button>

  </div>
</header>

<img class="burger-bars" src="/svg/bars-solid.svg" (click)="menuToggle()" />
