<div class="wrapper">
  <h2>Tech <span class="title-span">Shop</span></h2>
  <h1>პაროლის შეცვლა</h1>

  <form #oldpassword="ngForm" (ngSubmit)="changePass()">
    <div class="oldpass-div">
      <div class="label-div">
        <img src="/svg/lock-solid.svg" alt="" />
        <label for="oldpassword">ძველი პაროლი</label>
      </div>

      <input
        type="password"
        name="oldpassword"
        id="oldpassword"
        [(ngModel)]="changePassData.oldPassword"
        required
        placeholder="ძველი პაროლი"
        minlength="8"
      />
    </div>

    <div class="newpass-div">
      <div class="label-div">
        <img src="/svg/lock-solid.svg" alt="" />
        <label for="newpassword">ახალი პაროლი</label>
      </div>

      <input
        type="password"
        name="newpassword"
        id="newpassword"
        [(ngModel)]="changePassData.newPassword"
        required
        placeholder="ახალი პაროლი"
        minlength="8"
      />
    </div>

    @if (changePassData.oldPassword && changePassData.newPassword.length < 8) {
      <p class="invalid">პაროლი მოკლეა</p>
    }

    <button>დადასტურება</button>

    <span class="forgot-span">დაგავიწყდათ ძველი პაროლი?<a routerLink="/passrecover"> Email-ით აღდგენა</a></span>
  </form>
</div>
