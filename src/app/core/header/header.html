<header>
  <h1>Tech shop</h1>
  <div class="nav-div">
    <nav>
      <ul>
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            >Home</a
          >
        </li>
        <li><a routerLink="/about" routerLinkActive="active">About</a></li>
        <li><a routerLink="/contact" routerLinkActive="active">contact</a></li>
      </ul>
    </nav>
  </div>

  <img src="" (click)="menuToggle()" />

  <div class="burger-menu" [class.appear-menu]="AppearMenu">
    <div class="burger-list">
      <ul>
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
           (click)="menuToggle()" >Home</a
          >
        </li>
        <li><a routerLink="/about" routerLinkActive="active" (click)="menuToggle()" >About</a></li>
        <li><a routerLink="/contact" routerLinkActive="active" (click)="menuToggle()" >contact</a></li>

        <li><a routerLink="/signin" routerLinkActive="active" (click)="menuToggle()">Signin</a></li>
      
      </ul>
    </div>
  </div>

   <div class="btns"> 
    <button class="user-img" routerLink="/cart">
        <img src="svg/cart-arrow-down-solid.svg" alt="">
       </button>

     <button routerLink="/signin" class="user-img">
        <img src="svg/user-solid.svg" alt="user">
       </button>

       
   </div>
  

</header>
