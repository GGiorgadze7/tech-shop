<div class="main-div">
  <h1>შესვლა</h1>

<form #signInForm="ngForm" (ngSubmit)="onSubmit()">
  <label for="email">ემაილი</label>
  <input id="email" type="email" name="email" [(ngModel)]="signInData.email" required email placeholder="ემაილი"/>
  <label for="password">პაროლი</label>
  <input id="password" type="password" name="password" [(ngModel)]="signInData.password" required placeholder="პაროლი"/>
  <button [disabled]="signInForm.invalid">შესვლა</button>

  <span>არ გაქვთ ექაუნტი? <a routerLink="/signup">რეგისტრაცია</a></span>
</form>
</div>
